<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clima Tempo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card-clima { position: relative; margin-bottom: 1rem; }
    .btn-close-card { position: absolute; top: 0.5rem; right: 0.5rem; }
    .btn-send-card { position: absolute; top: 0.5rem; right: 2.5rem; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <h3 class="mb-4">Monitor de Clima</h3>
    <div class="input-group mb-4">
      <input type="text" id="urlInput" class="form-control" placeholder="Digite a URL do clima...">
      <button class="btn btn-primary" id="btnAdd">Adicionar</button>
    </div>
    <div id="cardsContainer" class="d-flex flex-column"></div>
  </div>

  <script>
    const btnAdd = document.getElementById('btnAdd');
    const urlInput = document.getElementById('urlInput');
    const cardsContainer = document.getElementById('cardsContainer');

    btnAdd.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (!url) return;
      const card = document.createElement('div');
      card.className = 'card card-clima';
      card.innerHTML = `
        <div class="card-body">
          <button class="btn btn-sm btn-outline-secondary btn-send-card">⇪</button>
          <button class="btn btn-sm btn-danger btn-close-card">✕</button>
          <h5 class="card-title">Cidade</h5>
          <p class="card-text">Dados do clima carregados de: ${url}</p>
        </div>`;
      card.querySelector('.btn-close-card').onclick = () => card.remove();
      cardsContainer.appendChild(card);
      urlInput.value = '';
    });
  </script>
</body>
</html>
